[package]
name = "scinit"
version = "0.1.0"
edition = "2021"
description = "A small init system for containers: signal forwarding, zombie reaping, live reload and systemd-style socket activation"
license = "Apache-2.0"

[[bin]]
name = "scinit"
path = "src/main.rs"

# Fixture child process used by the integration tests
[[bin]]
name = "scinit-test-child"
path = "tests/fixtures/test_child.rs"
test = false
doc = false

[dependencies]
color-eyre = "0.6.2"
eyre = "0.6.8"
nix = { version = "0.30.1", features = ["process", "term", "signal", "socket", "fs"] }
tokio = { version = "1.32.0", features = ["full", "signal", "net"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

# Live-reloading dependencies
notify = "8.1"
socket2 = "0.6"
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
anyhow = "1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
