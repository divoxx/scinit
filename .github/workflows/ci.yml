name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Fails if cargo fmt would change any file
      - name: Rustfmt
        run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both: some code only compiles on one platform (cfg(target_os))
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Warnings fail the build, including the crate-level lints (e.g. no
      # print!/eprintln!, since scinit logs through tracing)
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  linux:
    name: Tests (Linux, podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same path as local Linux runs: builds tests/container/Containerfile and
      # runs `cargo test` in rootless podman, with SCINIT_REQUIRE_PID1 set so
      # the PID-1 tests fail instead of skipping if no namespace can be made
      - name: Test
        run: scripts/test-linux.sh
